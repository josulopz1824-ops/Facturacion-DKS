<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global-styles.css">
    <title>Panel de Cobro | DKS-Hardware</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --dorado: #d4af37; --bg: #050505; --card: #121212; --danger: #ff4444; --success: #00c851; --warning: #ff8c00; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; padding: 40px; margin: 0; }
        
        .btn-home {
            position: fixed; top: 20px; left: 20px; background: #121212; color: #d4af37;
            text-decoration: none; padding: 10px 15px; border-radius: 8px; border: 1px solid #d4af37;
            display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 0.9rem;
            transition: 0.3s; z-index: 9999; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn-add {
            position: fixed; bottom: 30px; right: 30px; background: var(--dorado); color: black;
            padding: 15px 25px; border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); border: none; transition: 0.3s;
            z-index: 999; font-size: 1rem;
        }

        h1 { border-bottom: 2px solid var(--dorado); padding-bottom: 10px; margin-top: 40px; }
        .grid-deudores { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; margin-top: 30px; }
        
        .card-deuda { 
            background: var(--card); padding: 20px; border-radius: 12px; 
            border: 1px solid #222; display: flex; flex-direction: column;
            justify-content: space-between; transition: 0.3s;
        }

        .cliente-info h2 { margin: 0; color: var(--dorado); font-size: 1.4rem; }
        .productos-lista { color: #ccc; font-size: 0.85rem; margin: 10px 0; min-height: 40px; background: #1a1a1a; padding: 8px; border-radius: 5px; }
        .monto-total { font-size: 1.8rem; font-weight: bold; margin: 10px 0; color: var(--success); }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-cobrar { background: var(--success); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-abonar { background: var(--warning); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }

        .cart-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; border-bottom: 1px dashed #444; padding: 6px 0; }
        .btn-del { background: none; border: none; color: var(--danger); font-weight: bold; cursor: pointer; padding: 0 5px; font-size: 1rem; }
        .swal-dks-input { width: 85%; background: #222 !important; color: white !important; border: 1px solid #444 !important; border-radius: 5px !important; padding: 10px !important; margin: 5px 0 !important; }
        .swal-dks-select { width: 90%; background: #222; color: white; border: 1px solid var(--dorado); padding: 10px; border-radius: 5px; margin: 5px 0; }
    </style>
</head>
<body>

    <a href="dashboard.html" class="btn-home"><span>DASHBOARD</span></a>
    <button class="btn-add" id="btnNuevoFiado">+ REGISTRAR FIADO</button>
    <h1>Cuentas por Cobrar: <span id="nombreEmpresaLabel" style="color:var(--dorado)">...</span></h1>
    <div class="grid-deudores" id="contenedorDeudores"></div>

    <script type="module">
        import { db, verificarPermisos } from './auth-facturacion.js';
        import { collection, query, where, onSnapshot, doc, updateDoc, addDoc, getDocs, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let empresaActual = "";
        let listaProductos = [];
        let carritoTemporal = [];

        async function iniciar() {
            const user = await verificarPermisos();
            if (user) {
                empresaActual = user.empresa;
                document.getElementById('nombreEmpresaLabel').innerText = user.nombreLocal || empresaActual;
                await cargarProductosDesdeInventario();
                escucharDeudas();
            }
        }

        async function cargarProductosDesdeInventario() {
            const q = query(collection(db, "productos"), where("empresa", "==", empresaActual));
            const snap = await getDocs(q);
            listaProductos = [];
            snap.forEach(d => {
                const p = d.data();
                listaProductos.push({ id: d.id, nombre: p.nombre, precio: p.precio, stock: p.stock });
            });
        }

        function escucharDeudas() {
            const q = query(collection(db, "deudas"), where("empresa", "==", empresaActual));
            onSnapshot(q, (snapshot) => {
                const contenedor = document.getElementById('contenedorDeudores');
                contenedor.innerHTML = ""; 
                snapshot.forEach((documento) => {
                    const data = documento.data();
                    if (data.estado !== "pagado") {
                        const id = documento.id;
                        const colorBorde = data.estado === "abonado" ? "var(--warning)" : "var(--danger)";
                        const badgeVieja = data.esDeudaVieja ? `<span style="color:var(--warning); font-size:0.7rem; display:block;">[DEUDA VIEJA]</span>` : '';
                        
                        contenedor.innerHTML += `
                            <div class="card-deuda" style="border-left: 5px solid ${colorBorde}">
                                <div class="cliente-info">
                                    <h2>${data.cliente} ${badgeVieja}</h2>
                                    <div class="productos-lista">
                                        ${data.productos.map(p => `<div>${p}</div>`).join('')}
                                    </div>
                                </div>
                                <div>
                                    <div class="monto-total">L. ${parseFloat(data.total).toFixed(2)}</div>
                                    <div class="btn-group">
                                        <button class="btn-abonar" onclick="window.abonarDeuda('${id}', '${data.cliente}', ${data.total})">ABONAR</button>
                                        <button class="btn-cobrar" onclick="window.liquidarDeuda('${id}', '${data.cliente}', ${data.total})">SALDAR</button>
                                    </div>
                                </div>
                            </div>`;
                    }
                });
            });
        }

        // LÓGICA DE ABONO ACTUALIZADA PARA EL REPORTE
        window.abonarDeuda = async (id, nombre, totalActual) => {
            const { value: monto } = await Swal.fire({
                title: `Abonar a ${nombre}`,
                background: '#121212',
                color: '#fff',
                input: 'number',
                inputLabel: `Deuda actual: L. ${totalActual.toFixed(2)}`,
                confirmButtonColor: 'var(--success)',
                showCancelButton: true
            });

            if (monto) {
                const valorAbono = parseFloat(monto);
                if (valorAbono > totalActual) {
                    return Swal.fire('Error', 'El abono no puede ser mayor a la deuda', 'error');
                }

                const nuevoTotal = totalActual - valorAbono;
                
                await updateDoc(doc(db, "deudas", id), { 
                    total: nuevoTotal, 
                    estado: nuevoTotal <= 0 ? "pagado" : "abonado",
                    ultimoAbono: valorAbono, // <--- CRÍTICO PARA EL REPORTE
                    fecha: serverTimestamp() // <--- Actualizamos fecha para que aparezca en el reporte de hoy
                });

                Swal.fire('✅ Abonado', `Se recibió L. ${valorAbono.toLocaleString()}`, 'success');
            }
        };

        window.liquidarDeuda = async (id, nombre, total) => {
            const res = await Swal.fire({ 
                title: '¿Saldar cuenta?', 
                text: `¿Confirmas que ${nombre} pagó los L. ${total.toFixed(2)} restantes?`, 
                icon: 'warning', 
                background: '#121212',
                color: '#fff',
                showCancelButton: true,
                confirmButtonColor: 'var(--success)',
                confirmButtonText: 'SÍ, PAGADO'
            });

            if (res.isConfirmed) {
                // Al liquidar, el "último abono" es el total que restaba
                await updateDoc(doc(db, "deudas", id), { 
                    estado: "pagado", 
                    ultimoAbono: total, // <--- Esto suma a la caja del reporte
                    total: 0,
                    fecha: serverTimestamp() 
                });
                Swal.fire('✅ Pagado', 'Cuenta saldada y registrada en caja.', 'success');
            }
        };

        // ... resto del código de carrito sin cambios ...
        document.getElementById('btnNuevoFiado').onclick = async () => {
            carritoTemporal = [];
            if (listaProductos.length === 0) await cargarProductosDesdeInventario();
            const { value: nombreCliente } = await Swal.fire({
                title: 'Nombre del Cliente',
                input: 'text',
                background: '#121212',
                color: '#fff',
                confirmButtonColor: 'var(--dorado)',
                showCancelButton: true
            });
            if (nombreCliente) abrirVentanaCarrito(nombreCliente);
        };

        async function abrirVentanaCarrito(cliente) {
            let totalCarrito = carritoTemporal.reduce((acc, p) => acc + (p.precio * p.cantidad), 0);
            let itemsHtml = carritoTemporal.map((p, index) => 
                `<div class="cart-item">
                    <span>${p.cantidad}x ${p.nombre}</span>
                    <span>L. ${(p.precio * p.cantidad).toFixed(2)} <button class="btn-del" onclick="window.quitarDelCarrito(${index}, '${cliente}')">✕</button></span>
                </div>`
            ).join('');

            let optionsHtml = listaProductos.map(p => `<option value="${p.id}">${p.nombre} (Stock: ${p.stock})</option>`).join('');

            const { value: action } = await Swal.fire({
                title: `Fiado: ${cliente}`,
                background: '#121212',
                color: '#fff',
                html: `
                    <div style="text-align: left; margin-bottom: 15px; border: 1px dashed var(--dorado); padding: 10px; border-radius: 8px;">
                        <select id="sel-prod" class="swal-dks-select">${optionsHtml}</select>
                        <input id="num-cant" type="number" class="swal-dks-input" placeholder="Cantidad" value="1">
                        <button onclick="window.agregarAlCarrito('${cliente}')" class="btn-cobrar" style="padding: 8px; margin-top: 5px; width: 100%;">+ AÑADIR PRODUCTO</button>
                    </div>
                    <div id="lista-carrito" style="border: 1px solid #333; padding: 10px; max-height: 120px; overflow-y: auto; background: #000;">
                        ${itemsHtml || '<span style="color: #666">Lista vacía</span>'}
                    </div>
                    <div style="margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #1a1a1a; padding: 10px; border-radius: 8px;">
                        <input type="checkbox" id="chk-vieja" style="width: 20px; height: 20px; cursor: pointer;">
                        <label for="chk-vieja" style="color: var(--warning); font-size: 0.9rem; cursor: pointer;">¿DEUDA VIEJA? (No descontar stock)</label>
                    </div>
                    <h2 style="color: var(--success); margin-top: 15px;">Total: L. ${totalCarrito.toFixed(2)}</h2>
                `,
                showCancelButton: true,
                confirmButtonText: 'GUARDAR DEUDA',
                confirmButtonColor: 'var(--success)',
                preConfirm: () => {
                    if (carritoTemporal.length === 0) return Swal.showValidationMessage('La lista está vacía');
                    return { esDeudaVieja: document.getElementById('chk-vieja').checked };
                }
            });

            if (action) {
                try {
                    await addDoc(collection(db, "deudas"), {
                        cliente: cliente.toUpperCase(),
                        productos: carritoTemporal.map(p => `${p.cantidad}x ${p.nombre}`),
                        total: totalCarrito,
                        estado: "pendiente",
                        esDeudaVieja: action.esDeudaVieja,
                        empresa: empresaActual,
                        fecha: serverTimestamp()
                    });
                    if (!action.esDeudaVieja) {
                        for (const item of carritoTemporal) {
                            await updateDoc(doc(db, "productos", item.id), { stock: increment(-item.cantidad) });
                        }
                    }
                    Swal.fire('✅ Registrado', 'Deuda guardada.', 'success');
                    cargarProductosDesdeInventario();
                } catch (e) { Swal.fire('Error', e.message, 'error'); }
            }
        }

        window.agregarAlCarrito = (cliente) => {
            const id = document.getElementById('sel-prod').value;
            const cant = parseFloat(document.getElementById('num-cant').value);
            const producto = listaProductos.find(p => p.id === id);
            if (producto && cant > 0) {
                carritoTemporal.push({ ...producto, cantidad: cant });
                abrirVentanaCarrito(cliente);
            }
        };

        window.quitarDelCarrito = (index, cliente) => {
            carritoTemporal.splice(index, 1);
            abrirVentanaCarrito(cliente);
        };

        iniciar();
    </script>
</body>
</html>
