<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global-styles.css">
    <title>Panel de Cobro | DKS-Hardware</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --dorado: #d4af37; --bg: #050505; --card: #121212; --danger: #ff4444; --success: #00c851; --warning: #ff8c00; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; padding: 40px; margin: 0; }
        
        .btn-home {
            position: fixed; top: 20px; left: 20px; background: #121212; color: #d4af37;
            text-decoration: none; padding: 10px 15px; border-radius: 8px; border: 1px solid #d4af37;
            display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 0.9rem;
            transition: 0.3s; z-index: 9999; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn-nuevo {
            position: fixed; bottom: 30px; right: 30px; background: var(--dorado); color: black;
            padding: 15px 25px; border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); border: none; transition: 0.3s;
            z-index: 999;
        }
        .btn-nuevo:hover { transform: scale(1.1); filter: brightness(1.2); }

        h1 { border-bottom: 2px solid var(--dorado); padding-bottom: 10px; margin-top: 40px; }
        .grid-deudores { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; margin-top: 30px; }
        
        .card-deuda { 
            background: var(--card); padding: 20px; border-radius: 12px; 
            border: 1px solid #222; display: flex; flex-direction: column;
            justify-content: space-between; transition: 0.3s;
        }

        .cliente-info h2 { margin: 0; color: var(--dorado); font-size: 1.4rem; }
        .productos-lista { color: #888; font-size: 0.9rem; margin: 10px 0; }
        .monto-total { font-size: 1.8rem; font-weight: bold; margin: 10px 0; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-cobrar { background: var(--success); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-abonar { background: var(--warning); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        
        /* Estilos para el select dentro de SweetAlert */
        .swal-select {
            width: 100%; height: 50px; background: #222; color: white; border: 1px solid var(--dorado);
            border-radius: 5px; padding: 10px; margin-top: 10px; font-size: 1rem;
        }
    </style>
</head>
<body>

    <a href="dashboard.html" class="btn-home"><span>DASHBOARD</span></a>

    <button class="btn-nuevo" onclick="mostrarFormularioDeuda()">
        + NUEVA DEUDA
    </button>

    <h1>Cuentas por Cobrar: <span id="nombreEmpresaLabel" style="color:var(--dorado)">...</span></h1>
    <div class="grid-deudores" id="contenedorDeudores"></div>

    <script type="module">
        import { db, auth, verificarPermisos } from './auth-facturacion.js';
        import { collection, query, where, onSnapshot, doc, updateDoc, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let empresaActual = "";
        let listaInventario = [];

        async function iniciarDeudores() {
            const userData = await verificarPermisos();
            if (userData) {
                empresaActual = userData.empresa;
                document.getElementById('nombreEmpresaLabel').innerText = userData.nombreLocal || "Mi Empresa";
                
                // Cargar inventario una sola vez para el selector
                cargarInventarioLocal();
                inicializarEscuchaDeudas(empresaActual);
            }
        }

        async function cargarInventarioLocal() {
            const q = query(collection(db, "inventario"), where("empresa", "==", empresaActual));
            const snap = await getDocs(q);
            listaInventario = [];
            snap.forEach(d => listaInventario.push({ id: d.id, ...d.data() }));
        }

        function inicializarEscuchaDeudas(empID) {
            const q = query(collection(db, "deudas"), where("empresa", "==", empID));
            onSnapshot(q, (snapshot) => {
                const contenedor = document.getElementById('contenedorDeudores');
                contenedor.innerHTML = ""; 
                snapshot.forEach((documento) => {
                    const data = documento.data();
                    if (data.estado !== "pagado") {
                        const colorBorde = data.estado === "abonado" ? "var(--warning)" : "var(--danger)";
                        contenedor.innerHTML += `
                            <div class="card-deuda" style="border-left: 5px solid ${colorBorde}">
                                <div class="cliente-info">
                                    <h2>${data.cliente}</h2>
                                    <div class="productos-lista">
                                        <b>Artículos:</b> ${data.productos.join(", ")}
                                    </div>
                                </div>
                                <div>
                                    <div class="monto-total">L. ${parseFloat(data.total).toFixed(2)}</div>
                                    <div class="btn-group">
                                        <button class="btn-abonar" onclick="abonarDeuda('${documento.id}', '${data.cliente}', ${data.total})">ABONAR</button>
                                        <button class="btn-cobrar" onclick="liquidarDeuda('${documento.id}', '${data.cliente}')">SALDAR</button>
                                    </div>
                                </div>
                            </div>`;
                    }
                });
            });
        }

        // --- FORMULARIO CON SELECTOR DE INVENTARIO ---
        window.mostrarFormularioDeuda = async () => {
            // Creamos las opciones del select basadas en el inventario
            let opcionesHtml = listaInventario.map(prod => 
                `<option value="${prod.precioVenta}|${prod.nombre}">${prod.nombre} - L. ${prod.precioVenta}</option>`
            ).join('');

            const { value: formValues } = await Swal.fire({
                title: 'Registrar Deuda con Inventario',
                background: '#121212',
                color: '#fff',
                html: `
                    <input id="swal-nombre" class="swal2-input" style="color:white" placeholder="Nombre del Cliente">
                    <select id="swal-producto" class="swal-select">
                        <option value="">-- Seleccione Producto --</option>
                        ${opcionesHtml}
                    </select>
                    <input id="swal-cantidad" class="swal2-input" type="number" style="color:white" placeholder="Cantidad" value="1">
                `,
                focusConfirm: false,
                confirmButtonColor: 'var(--dorado)',
                confirmButtonText: 'Guardar en Cuenta',
                preConfirm: () => {
                    const prodData = document.getElementById('swal-producto').value.split('|');
                    return {
                        nombre: document.getElementById('swal-nombre').value.toUpperCase(),
                        precio: parseFloat(prodData[0]),
                        articulo: prodData[1],
                        cantidad: parseInt(document.getElementById('swal-cantidad').value)
                    }
                }
            });

            if (formValues && formValues.nombre && formValues.articulo) {
                const totalDeuda = formValues.precio * formValues.cantidad;
                try {
                    await addDoc(collection(db, "deudas"), {
                        cliente: formValues.nombre,
                        productos: [`${formValues.cantidad}x ${formValues.articulo}`],
                        total: totalDeuda,
                        estado: "pendiente",
                        empresa: empresaActual,
                        fecha: serverTimestamp()
                    });
                    Swal.fire('✅ Registrado', 'La deuda se guardó correctamente', 'success');
                } catch (e) {
                    Swal.fire('Error', e.message, 'error');
                }
            }
        };

        // (Aquí se mantienen tus funciones de liquidarDeuda y abonarDeuda igual que antes)
        window.liquidarDeuda = async (id, nombre) => { /* ... tu código ... */ };
        window.abonarDeuda = async (id, nombre, total) => { /* ... tu código ... */ };

        iniciarDeudores();
    </script>
</body>
</html>
