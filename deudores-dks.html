<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cobro | DKS-Hardware</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --dorado: #d4af37; --bg: #050505; --card: #121212; --danger: #ff4444; --success: #00c851; --warning: #ff8c00; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; padding-top: 60px; }
        
        .btn-home {
            position: fixed; top: 15px; left: 15px; background: #121212; color: #d4af37;
            text-decoration: none; padding: 8px 12px; border-radius: 8px; border: 1px solid #d4af37;
            display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 0.85rem;
            transition: 0.3s; z-index: 9999;
        }

        .btn-add {
            position: fixed; bottom: 25px; right: 25px; background: var(--dorado); color: black;
            padding: 15px 25px; border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); border: none; z-index: 999;
        }

        h1 { border-bottom: 2px solid var(--dorado); padding-bottom: 10px; font-size: 1.5rem; }
        .grid-deudores { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        
        .card-deuda { 
            background: var(--card); padding: 15px; border-radius: 12px; 
            border: 1px solid #222; display: flex; flex-direction: column; gap: 10px;
        }

        .cliente-info h2 { margin: 0; color: var(--dorado); font-size: 1.2rem; text-transform: uppercase; }
        .productos-lista { color: #ccc; font-size: 0.8rem; background: #1a1a1a; padding: 10px; border-radius: 5px; max-height: 80px; overflow-y: auto; }
        .monto-total { font-size: 1.6rem; font-weight: bold; color: var(--success); }
        
        .btn-group { display: flex; gap: 8px; }
        .btn-cobrar { background: var(--success); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-abonar { background: var(--warning); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }

        .cart-container { max-height: 200px; overflow-y: auto; border: 1px solid #333; background: #000; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .cart-item { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 5px 0; border-bottom: 1px dashed #444; }
        .btn-del { color: var(--danger); background: none; border: none; cursor: pointer; font-weight: bold; }
        .swal-dks-input { width: 80% !important; background: #222 !important; color: #fff !important; border: 1px solid #444 !important; margin: 5px auto !important; }
        .swal-dks-select { width: 85%; background: #222; color: #fff; border: 1px solid var(--dorado); padding: 8px; border-radius: 5px; }
    </style>
</head>
<body>

    <a href="dashboard.html" class="btn-home"><span>DASHBOARD</span></a>
    <button class="btn-add" id="btnNuevoFiado">+ NUEVO FIADO</button>
    
    <h1>Cuentas por Cobrar: <span id="nombreEmpresaLabel" style="color:var(--dorado)">...</span></h1>
    <div class="grid-deudores" id="contenedorDeudores"></div>

    <script type="module">
        import { db, verificarPermisos } from './auth-facturacion.js';
        import { collection, query, where, onSnapshot, doc, updateDoc, addDoc, getDocs, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let empresaActual = "";
        let listaProductos = [];
        let carritoTemporal = [];

        async function iniciar() {
            const user = await verificarPermisos();
            if (user) {
                empresaActual = user.empresa;
                document.getElementById('nombreEmpresaLabel').innerText = user.nombreLocal || empresaActual.replace(/_/g, ' ');
                await cargarProductosDesdeInventario();
                escucharDeudas();
            }
        }

        async function cargarProductosDesdeInventario() {
            const q = query(collection(db, "productos"), where("empresa", "==", empresaActual));
            const snap = await getDocs(q);
            listaProductos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        }

        function escucharDeudas() {
            const q = query(collection(db, "deudas"), where("empresa", "==", empresaActual));
            onSnapshot(q, (snapshot) => {
                const contenedor = document.getElementById('contenedorDeudores');
                contenedor.innerHTML = ""; 
                snapshot.forEach((docu) => {
                    const data = docu.data();
                    if (data.estado !== "pagado") {
                        const id = docu.id;
                        const color = data.estado === "abonado" ? "var(--warning)" : "var(--danger)";
                        const badge = data.esDeudaVieja ? `<small style="color:orange">[VIEJA]</small>` : '';
                        
                        contenedor.innerHTML += `
                            <div class="card-deuda" style="border-left: 5px solid ${color}">
                                <div class="cliente-info">
                                    <h2>${data.cliente} ${badge}</h2>
                                    <div class="productos-lista">
                                        ${data.productos.map(p => `<div>• ${p}</div>`).join('')}
                                    </div>
                                </div>
                                <div class="monto-total">L. ${parseFloat(data.total).toLocaleString()}</div>
                                <div class="btn-group">
                                    <button class="btn-abonar" onclick="mandarAbono('${id}', '${data.cliente}', ${data.total})">ABONAR</button>
                                    <button class="btn-cobrar" onclick="mandarLiquidar('${id}', '${data.cliente}', ${data.total})">SALDAR</button>
                                </div>
                            </div>`;
                    }
                });
            });
        }

        window.mandarAbono = async (id, nombre, totalActual) => {
            const { value: monto } = await Swal.fire({
                title: `Abono: ${nombre}`,
                input: 'number',
                inputLabel: `Deuda: L. ${totalActual.toLocaleString()}`,
                background: '#121212', color: '#fff', confirmButtonColor: 'var(--success)', showCancelButton: true
            });

            if (monto) {
                const valorAbono = parseFloat(monto);
                if (valorAbono > totalActual) return Swal.fire('Error', 'Abono excede la deuda', 'error');

                await updateDoc(doc(db, "deudas", id), {
                    total: totalActual - valorAbono,
                    estado: (totalActual - valorAbono) <= 0 ? "pagado" : "abonado",
                    ultimoAbono: valorAbono, // Esto alimenta la caja hoy
                    fecha: serverTimestamp() 
                });
                Swal.fire('✅ Recibido', `L. ${valorAbono.toLocaleString()} sumados a caja`, 'success');
            }
        };

        window.mandarLiquidar = async (id, nombre, totalRestante) => {
            const res = await Swal.fire({
                title: '¿Saldar cuenta?',
                text: `¿Confirmas el pago total de L. ${totalRestante.toLocaleString()}?`,
                icon: 'warning', background: '#121212', color: '#fff',
                showCancelButton: true, confirmButtonColor: 'var(--success)', confirmButtonText: 'SÍ, PAGADO'
            });

            if (res.isConfirmed) {
                // EXPLICACIÓN: Guardamos totalRestante en ultimoAbono para que el reporte lo sume hoy
                await updateDoc(doc(db, "deudas", id), {
                    estado: "pagado",
                    ultimoAbono: totalRestante, 
                    total: 0,
                    fecha: serverTimestamp() // Obligatorio para que salga en el reporte de HOY
                });
                Swal.fire('✅ Liquidado', 'Dinero registrado en el reporte diario.', 'success');
            }
        };

        document.getElementById('btnNuevoFiado').onclick = async () => {
            carritoTemporal = [];
            const { value: cliente } = await Swal.fire({
                title: 'Nombre Cliente', input: 'text', background: '#121212', color: '#fff', confirmButtonColor: 'var(--dorado)'
            });
            if (cliente) abrirCarrito(cliente);
        };

        async function abrirCarrito(cliente) {
            let total = carritoTemporal.reduce((acc, p) => acc + (p.precio * p.cantidad), 0);
            let itemsHtml = carritoTemporal.map((p, i) => `
                <div class="cart-item">
                    <span>${p.cantidad}x ${p.nombre}</span>
                    <span>L. ${(p.precio*p.cantidad).toFixed(2)} <button class="btn-del" onclick="quitar('${i}', '${cliente}')">✕</button></span>
                </div>`).join('') || '<span style="color:#666">Carrito vacío</span>';

            let options = listaProductos.map(p => `<option value="${p.id}">${p.nombre} (L.${p.precio})</option>`).join('');

            const { value: result, isConfirmed } = await Swal.fire({
                title: `Fiado: ${cliente}`,
                background: '#121212', color: '#fff',
                html: `
                    <div style="margin-bottom:10px;">
                        <select id="sw-prod" class="swal-dks-select">${options}</select>
                        <input id="sw-cant" type="number" class="swal-dks-input" value="1">
                        <button onclick="agregar('${cliente}')" class="btn-cobrar" style="width:90%; padding:5px; margin-top:5px;">+ AÑADIR</button>
                    </div>
                    <div class="cart-container">${itemsHtml}</div>
                    <div style="font-size:0.8rem; color:var(--warning); margin-bottom:10px;">
                        <input type="checkbox" id="sw-vieja"> <label for="sw-vieja">¿DEUDA VIEJA? (No quita stock)</label>
                    </div>
                    <h2 style="color:var(--success)">Total: L. ${total.toFixed(2)}</h2>`,
                showCancelButton: true, confirmButtonText: 'GUARDAR DEUDA', confirmButtonColor: 'var(--success)',
                preConfirm: () => ({ vieja: document.getElementById('sw-vieja').checked })
            });

            if (isConfirmed && carritoTemporal.length > 0) {
                await addDoc(collection(db, "deudas"), {
                    cliente: cliente.toUpperCase(),
                    productos: carritoTemporal.map(p => `${p.cantidad}x ${p.nombre}`),
                    total: total,
                    totalOriginal: total, 
                    estado: "pendiente",
                    esDeudaVieja: result.vieja,
                    empresa: empresaActual,
                    fecha: serverTimestamp()
                });
                
                if (!result.vieja) {
                    for (let item of carritoTemporal) {
                        await updateDoc(doc(db, "productos", item.id), { stock: increment(-item.cantidad) });
                    }
                }
                Swal.fire('✅ Registrado', 'Deuda guardada correctamente', 'success');
            }
        }

        window.agregar = (c) => {
            const id = document.getElementById('sw-prod').value;
            const cant = parseFloat(document.getElementById('sw-cant').value);
            const p = listaProductos.find(prod => prod.id === id);
            if (p && cant > 0) { carritoTemporal.push({...p, cantidad: cant}); abrirCarrito(c); }
        };

        window.quitar = (i, c) => { carritoTemporal.splice(i, 1); abrirCarrito(c); };

        iniciar();
    </script>
</body>
</html>
