<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global-styles.css">
    <title>Panel de Cobro | DKS-Hardware</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --dorado: #d4af37; --bg: #050505; --card: #121212; --danger: #ff4444; --success: #00c851; --warning: #ff8c00; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; padding: 40px; margin: 0; }
        
        .btn-home {
            position: fixed; top: 20px; left: 20px; background: #121212; color: #d4af37;
            text-decoration: none; padding: 10px 15px; border-radius: 8px; border: 1px solid #d4af37;
            display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 0.9rem;
            transition: 0.3s; z-index: 9999; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn-nuevo {
            position: fixed; bottom: 30px; right: 30px; background: var(--dorado); color: black;
            padding: 15px 25px; border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); border: none; transition: 0.3s;
            z-index: 999; font-size: 1rem;
        }
        .btn-nuevo:hover { transform: scale(1.1); filter: brightness(1.2); }

        h1 { border-bottom: 2px solid var(--dorado); padding-bottom: 10px; margin-top: 40px; }
        .grid-deudores { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; margin-top: 30px; }
        
        .card-deuda { 
            background: var(--card); padding: 20px; border-radius: 12px; 
            border: 1px solid #222; display: flex; flex-direction: column;
            justify-content: space-between; transition: 0.3s;
        }

        .cliente-info h2 { margin: 0; color: var(--dorado); font-size: 1.4rem; }
        .productos-lista { color: #888; font-size: 0.9rem; margin: 10px 0; min-height: 40px; }
        .monto-total { font-size: 1.8rem; font-weight: bold; margin: 10px 0; color: #fff; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-cobrar { background: var(--success); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-abonar { background: var(--warning); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        
        /* Estilos para el formulario de SweetAlert */
        .swal-custom-input { width: 80%; background: #222 !important; color: white !important; border: 1px solid #444 !important; border-radius: 5px !important; padding: 10px !important; margin: 10px 0 !important; }
        .swal-custom-select { width: 85%; background: #222; color: white; border: 1px solid var(--dorado); padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>

    <a href="dashboard.html" class="btn-home"><span>DASHBOARD</span></a>

    <button class="btn-nuevo" id="btnAbrirFormulario">
        + NUEVA DEUDA
    </button>

    <h1>Cuentas por Cobrar: <span id="nombreEmpresaLabel" style="color:var(--dorado)">Cargando...</span></h1>
    <div class="grid-deudores" id="contenedorDeudores"></div>

    <script type="module">
        import { db, verificarPermisos } from './auth-facturacion.js';
        import { collection, query, where, onSnapshot, doc, updateDoc, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let empresaActual = "";
        let listaInventario = [];

        async function iniciarDeudores() {
            const userData = await verificarPermisos();
            if (userData) {
                empresaActual = userData.empresa;
                document.getElementById('nombreEmpresaLabel').innerText = userData.nombreLocal || userData.empresa;
                
                // 1. Cargar inventario para el selector
                await cargarInventario();
                // 2. Escuchar cambios en las deudas
                inicializarEscuchaDeudas();
            }
        }

        async function cargarInventario() {
            try {
                const q = query(collection(db, "inventario"), where("empresa", "==", empresaActual));
                const snap = await getDocs(q);
                listaInventario = [];
                snap.forEach(d => {
                    const item = d.data();
                    listaInventario.push({ 
                        nombre: item.nombre, 
                        precio: parseFloat(item.precioVenta || 0) 
                    });
                });
                console.log("📦 Inventario cargado:", listaInventario.length, "productos.");
            } catch (e) {
                console.error("Error cargando inventario:", e);
            }
        }

        function inicializarEscuchaDeudas() {
            const q = query(collection(db, "deudas"), where("empresa", "==", empresaActual));
            onSnapshot(q, (snapshot) => {
                const contenedor = document.getElementById('contenedorDeudores');
                contenedor.innerHTML = ""; 
                let hayDeudas = false;

                snapshot.forEach((documento) => {
                    const data = documento.data();
                    if (data.estado !== "pagado") {
                        hayDeudas = true;
                        const id = documento.id;
                        const colorBorde = data.estado === "abonado" ? "var(--warning)" : "var(--danger)";
                        
                        contenedor.innerHTML += `
                            <div class="card-deuda" style="border-left: 5px solid ${colorBorde}">
                                <div class="cliente-info">
                                    <h2>${data.cliente}</h2>
                                    <div class="productos-lista">
                                        <b>Detalle:</b> ${Array.isArray(data.productos) ? data.productos.join(", ") : data.productos}
                                    </div>
                                </div>
                                <div>
                                    <div class="monto-total">L. ${parseFloat(data.total).toFixed(2)}</div>
                                    <div class="btn-group">
                                        <button class="btn-abonar" onclick="window.abonarDeuda('${id}', '${data.cliente}', ${data.total})">ABONAR</button>
                                        <button class="btn-cobrar" onclick="window.liquidarDeuda('${id}', '${data.cliente}')">SALDAR</button>
                                    </div>
                                </div>
                            </div>`;
                    }
                });
                if (!hayDeudas) contenedor.innerHTML = "<p>No hay cuentas pendientes.</p>";
            });
        }

        // --- BOTÓN NUEVA DEUDA ---
        document.getElementById('btnAbrirFormulario').onclick = async () => {
            if (listaInventario.length === 0) await cargarInventario();

            let opcionesHtml = listaInventario.map(p => 
                `<option value="${p.precio}|${p.nombre}">${p.nombre} (L. ${p.precio})</option>`
            ).join('');

            const { value: formValues } = await Swal.fire({
                title: 'Registrar Deuda',
                background: '#121212',
                color: '#fff',
                html: `
                    <input id="swal-nombre" class="swal-custom-input" placeholder="Nombre del Cliente">
                    <select id="swal-prod" class="swal-custom-select">
                        <option value="">-- Seleccione Producto --</option>
                        ${opcionesHtml}
                    </select>
                    <input id="swal-cant" type="number" class="swal-custom-input" placeholder="Cantidad" value="1">
                `,
                showCancelButton: true,
                confirmButtonText: 'Guardar Deuda',
                confirmButtonColor: 'var(--dorado)',
                preConfirm: () => {
                    const nombre = document.getElementById('swal-nombre').value;
                    const prodRaw = document.getElementById('swal-prod').value;
                    const cant = document.getElementById('swal-cant').value;
                    if (!nombre || !prodRaw || !cant) {
                        Swal.showValidationMessage('Todos los campos son obligatorios');
                        return false;
                    }
                    const [precio, articulo] = prodRaw.split('|');
                    return { nombre: nombre.toUpperCase(), precio: parseFloat(precio), articulo, cant: parseInt(cant) };
                }
            });

            if (formValues) {
                const total = formValues.precio * formValues.cant;
                try {
                    await addDoc(collection(db, "deudas"), {
                        cliente: formValues.nombre,
                        productos: [`${formValues.cant}x ${formValues.articulo}`],
                        total: total,
                        estado: "pendiente",
                        empresa: empresaActual,
                        fecha: serverTimestamp()
                    });
                    Swal.fire('Guardado', 'Deuda registrada con éxito', 'success');
                } catch (e) {
                    Swal.fire('Error', 'No se pudo guardar', 'error');
                }
            }
        };

        // --- FUNCIONES GLOBALES (ACCESIBLES DESDE EL HTML) ---
        window.abonarDeuda = async (id, nombre, totalActual) => {
            const { value: monto } = await Swal.fire({
                title: `Abonar a ${nombre}`,
                input: 'number',
                inputLabel: `Saldo actual: L. ${totalActual.toFixed(2)}`,
                showCancelButton: true,
                inputValidator: (v) => { if(!v || v <= 0 || v > totalActual) return 'Monto inválido'; }
            });

            if (monto) {
                const nuevoTotal = totalActual - parseFloat(monto);
                await updateDoc(doc(db, "deudas", id), {
                    total: nuevoTotal,
                    estado: nuevoTotal <= 0 ? "pagado" : "abonado",
                    ultimoAbono: parseFloat(monto),
                    fechaAbono: serverTimestamp()
                });
                Swal.fire('Abonado', 'Saldo actualizado', 'success');
            }
        };

        window.liquidarDeuda = async (id, nombre) => {
            const confirm = await Swal.fire({
                title: '¿Saldar cuenta?',
                text: `¿${nombre} pagó el total?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: 'var(--success)'
            });
            if (confirm.isConfirmed) {
                await updateDoc(doc(db, "deudas", id), { estado: "pagado", fechaPago: serverTimestamp() });
                Swal.fire('Pagado', 'Cuenta cerrada', 'success');
            }
        };

        iniciarDeudores();
    </script>
</body>
</html>
