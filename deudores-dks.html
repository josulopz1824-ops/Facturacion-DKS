<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global-styles.css">
    <title>Panel de Cobro | DKS-Hardware</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --dorado: #d4af37; --bg: #050505; --card: #121212; --danger: #ff4444; --success: #00c851; --warning: #ff8c00; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; padding: 40px; margin: 0; }
        
        .btn-home {
            position: fixed; top: 20px; left: 20px; background: #121212; color: #d4af37;
            text-decoration: none; padding: 10px 15px; border-radius: 8px; border: 1px solid #d4af37;
            display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 0.9rem;
            transition: 0.3s; z-index: 9999; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn-add {
            position: fixed; bottom: 30px; right: 30px; background: var(--dorado); color: black;
            padding: 15px 25px; border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); border: none; transition: 0.3s;
            z-index: 999; font-size: 1rem;
        }
        .btn-add:hover { transform: scale(1.1); filter: brightness(1.2); }

        h1 { border-bottom: 2px solid var(--dorado); padding-bottom: 10px; margin-top: 40px; }
        .grid-deudores { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; margin-top: 30px; }
        
        .card-deuda { 
            background: var(--card); padding: 20px; border-radius: 12px; 
            border: 1px solid #222; display: flex; flex-direction: column;
            justify-content: space-between; transition: 0.3s;
        }

        .cliente-info h2 { margin: 0; color: var(--dorado); font-size: 1.4rem; }
        .productos-lista { color: #888; font-size: 0.9rem; margin: 10px 0; min-height: 40px; }
        .monto-total { font-size: 1.8rem; font-weight: bold; margin: 10px 0; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-cobrar { background: var(--success); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-abonar { background: var(--warning); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }

        /* Estilos Inputs Swal */
        .swal-input-dks { width: 80%; background: #222 !important; color: white !important; border: 1px solid #444 !important; border-radius: 5px !important; padding: 10px !important; margin: 5px 0 !important; }
        .swal-select-dks { width: 85%; background: #222; color: white; border: 1px solid var(--dorado); padding: 10px; border-radius: 5px; margin: 5px 0; }
    </style>
</head>
<body>

    <a href="dashboard.html" class="btn-home"><span>DASHBOARD</span></a>

    <button class="btn-add" id="btnNuevaDeuda">+ REGISTRAR FIADO</button>

    <h1>Cuentas por Cobrar: <span id="nombreEmpresaLabel" style="color:var(--dorado)">...</span></h1>
    <div class="grid-deudores" id="contenedorDeudores"></div>

    <script type="module">
        import { db, verificarPermisos } from './auth-facturacion.js';
        import { collection, query, where, onSnapshot, doc, updateDoc, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let empresaActual = "";
        let cacheInventario = [];

        async function iniciarDeudores() {
            const userData = await verificarPermisos();
            if (userData) {
                empresaActual = userData.empresa;
                document.getElementById('nombreEmpresaLabel').innerText = userData.nombreLocal || "Mi Empresa";
                
                // Cargar inventario para el selector
                await cargarInventario();
                escucharDeudas();
            }
        }

        async function cargarInventario() {
            const q = query(collection(db, "inventario"), where("empresa", "==", empresaActual));
            const snap = await getDocs(q);
            cacheInventario = [];
            snap.forEach(d => cacheInventario.push({ ...d.data(), id: d.id }));
        }

        function escucharDeudas() {
            const q = query(collection(db, "deudas"), where("empresa", "==", empresaActual));
            onSnapshot(q, (snapshot) => {
                const contenedor = document.getElementById('contenedorDeudores');
                contenedor.innerHTML = ""; 
                snapshot.forEach((documento) => {
                    const data = documento.data();
                    if (data.estado !== "pagado") {
                        const id = documento.id;
                        const colorBorde = data.estado === "abonado" ? "var(--warning)" : "var(--danger)";
                        contenedor.innerHTML += `
                            <div class="card-deuda" style="border-left: 5px solid ${colorBorde}">
                                <div class="cliente-info">
                                    <h2>${data.cliente}</h2>
                                    <div class="productos-lista"><b>Artículos:</b> ${data.productos.join(", ")}</div>
                                </div>
                                <div>
                                    <div class="monto-total">L. ${parseFloat(data.total).toFixed(2)}</div>
                                    <div class="btn-group">
                                        <button class="btn-abonar" onclick="window.abonarDeuda('${id}', '${data.cliente}', ${data.total})">ABONAR</button>
                                        <button class="btn-cobrar" onclick="window.liquidarDeuda('${id}', '${data.cliente}')">SALDAR</button>
                                    </div>
                                </div>
                            </div>`;
                    }
                });
            });
        }

        // --- VENTANA DE NUEVA DEUDA ---
        document.getElementById('btnNuevaDeuda').onclick = async () => {
            if (cacheInventario.length === 0) await cargarInventario();

            const opciones = cacheInventario.map(p => `<option value="${p.precioVenta}|${p.nombre}">${p.nombre} (L. ${p.precioVenta})</option>`).join('');

            const { value: formValues } = await Swal.fire({
                title: 'Nuevo Registro de Fiado',
                background: '#121212',
                color: '#fff',
                html: `
                    <input id="swal-cliente" class="swal-input-dks" placeholder="Nombre del Cliente">
                    <select id="swal-prod" class="swal-select-dks">
                        <option value="">-- Seleccione Producto --</option>
                        ${opciones}
                    </select>
                    <input id="swal-cant" type="number" class="swal-input-dks" placeholder="Cantidad" value="1">
                `,
                showCancelButton: true,
                confirmButtonText: 'Registrar Deuda',
                confirmButtonColor: 'var(--dorado)',
                preConfirm: () => {
                    const cliente = document.getElementById('swal-cliente').value;
                    const prodData = document.getElementById('swal-prod').value;
                    const cant = document.getElementById('swal-cant').value;
                    if (!cliente || !prodData || !cant) return Swal.showValidationMessage('Complete todos los campos');
                    
                    const [precio, nombreProd] = prodData.split('|');
                    return { cliente: cliente.toUpperCase(), precio: parseFloat(precio), articulo: nombreProd, cantidad: parseInt(cant) };
                }
            });

            if (formValues) {
                const totalCalculado = formValues.precio * formValues.cantidad;
                try {
                    await addDoc(collection(db, "deudas"), {
                        cliente: formValues.cliente,
                        productos: [`${formValues.cantidad}x ${formValues.articulo}`],
                        total: totalCalculado,
                        estado: "pendiente",
                        empresa: empresaActual,
                        fecha: serverTimestamp()
                    });
                    Swal.fire('✅ Éxito', 'Deuda registrada y vinculada al inventario.', 'success');
                } catch (e) {
                    Swal.fire('Error', 'No se pudo guardar la deuda.', 'error');
                }
            }
        };

        // --- FUNCIONES GLOBALES ---
        window.abonarDeuda = async (id, nombre, total) => {
            const { value: monto } = await Swal.fire({
                title: `Abonar a ${nombre}`,
                input: 'number',
                inputLabel: `Deuda: L. ${total.toFixed(2)}`,
                showCancelButton: true,
                inputValidator: (v) => { if(!v || v <= 0 || v > total) return 'Monto inválido'; }
            });
            if (monto) {
                const nt = total - parseFloat(monto);
                await updateDoc(doc(db, "deudas", id), { total: nt, estado: nt <= 0 ? "pagado" : "abonado", fechaAbono: serverTimestamp() });
                Swal.fire('✅ Abonado', '', 'success');
            }
        };

        window.liquidarDeuda = async (id, nombre) => {
            const res = await Swal.fire({ title: '¿Saldar cuenta?', text: `Confirmas pago total de ${nombre}`, icon: 'warning', showCancelButton: true });
            if (res.isConfirmed) {
                await updateDoc(doc(db, "deudas", id), { estado: "pagado", fechaPago: serverTimestamp() });
                Swal.fire('✅ Pagado', '', 'success');
            }
        };

        iniciarDeudores();
    </script>
</body>
</html>
