<script type="module">
        import { db, verificarPermisos } from './auth-facturacion.js';
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let empresaID = "";
        let logoBase64 = "";

        // Lógica para procesar la imagen (Se mantiene igual)
        document.getElementById('inputLogo').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    logoBase64 = event.target.result;
                    mostrarPreview(logoBase64);
                };
                reader.readAsDataURL(file);
            }
        };

        function mostrarPreview(src) {
            const img = document.getElementById('imgPreview');
            const placeholder = document.getElementById('logoPlaceholder');
            img.src = src;
            img.style.display = "inline-block";
            placeholder.style.display = "none";
        }

        async function cargarDatos() {
            const user = await verificarPermisos();
            // BLOQUEO DE SEGURIDAD: Si no hay empresaID, no carga nada
            if(user && user.empresa) {
                empresaID = user.empresa;
                
                // Apuntamos específicamente al documento que tiene el nombre del ID de la empresa
                const docRef = doc(db, "configuracion", empresaID);
                const snap = await getDoc(docRef);
                
                if(snap.exists()) {
                    const d = snap.data();
                    document.getElementById('confNombre').value = d.nombre || "";
                    document.getElementById('confRTN').value = d.rtn || "";
                    document.getElementById('confTel').value = d.telefono || "";
                    document.getElementById('confDir').value = d.direccion || "";
                    document.getElementById('confMsg').value = d.mensaje || "";
                    
                    if (d.logo) {
                        logoBase64 = d.logo;
                        mostrarPreview(d.logo);
                    }
                }
            } else {
                Swal.fire('Error', 'No se detectó una empresa vinculada a tu cuenta', 'error');
            }
        }

        document.getElementById('configForm').onsubmit = async (e) => {
            e.preventDefault();

            // DOBLE VERIFICACIÓN: Evita guardar si empresaID está vacío por error de carga
            if (!empresaID) {
                return Swal.fire('Error', 'No hay ID de empresa válido. Recarga la página.', 'error');
            }

            try {
                // setDoc con ID de empresa garantiza que SOLO se actualice el dato de esa empresa
                const docRef = doc(db, "configuracion", empresaID);
                
                const nuevosDatos = {
                    nombre: document.getElementById('confNombre').value.trim(),
                    rtn: document.getElementById('confRTN').value.trim(),
                    telefono: document.getElementById('confTel').value.trim(),
                    direccion: document.getElementById('confDir').value.trim(),
                    mensaje: document.getElementById('confMsg').value.trim(),
                    logo: logoBase64,
                    ultimaActualizacion: new Date() // Opcional: para control interno
                };

                await setDoc(docRef, nuevosDatos, { merge: true });
                
                Swal.fire('¡Éxito!', 'Los datos de tu empresa se actualizaron correctamente', 'success');
            } catch (err) {
                console.error("Error al guardar:", err);
                Swal.fire('Error', 'No se pudo guardar: ' + err.message, 'error');
            }
        };

        cargarDatos();
    </script>
